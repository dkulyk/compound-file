name: tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.5', coverage: none}
      - run: composer update --prefer-dist --no-interaction
      - run: composer quality

  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: windows-latest
            php: '8.3'
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '${{ matrix.php }}', coverage: none}
      - run: composer update --prefer-dist --no-interaction
      - run: composer test

  lowest:
    name: Lowest dependencies on PHP 8.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.1', coverage: none}
      - run: composer update --prefer-lowest --prefer-dist --no-interaction
      - run: composer test
