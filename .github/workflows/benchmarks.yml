name: benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '43 4 * * 0'

permissions:
  contents: read

concurrency:
  group: benchmarks
  cancel-in-progress: true

jobs:
  reader:
    name: Reader baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', coverage: none}
      - run: composer install --prefer-dist --no-interaction
      - name: Measure reader performance
        run: composer benchmark | tee benchmark.txt
      - name: Publish run summary
        run: |
          echo '## Reader benchmark' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat benchmark.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: reader-benchmark-${{ github.sha }}
          path: benchmark.txt
          retention-days: 90
